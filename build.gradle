plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.20.1-1.2.1'
group = 'com.shermansplanet.otherverse' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'otherverse'

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.20.1'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg') // Currently, this location cannot be changed from the default.

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', 'otherverse'

            mods {
                otherverse {
                    source sourceSets.main
                }
            }

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'otherverse'

            mods {
                otherverse {
                    source sourceSets.main
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'otherverse'

            mods {
                otherverse {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'otherverse', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                otherverse {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    flatDir {
        dir 'libs'
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "C4's Maven"
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        url = "https://jitpack.io"
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "chickenbones"
        url = "https://chickenbones.net/maven"
    }
}

dependencies {
    // Specify the version of Minecraft to use. If this is any group other than 'net.minecraft', it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency, and its patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.1'

    // compile against the JEI API but do not include it at runtime
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // at runtime, use the full JEI jar for Forge
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    implementation fg.deobf("vazkii.patchouli:Patchouli:1.20.1-83-FORGE")

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    compileOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:${caelus_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:${caelus_version}")

    implementation fg.deobf("com.github.Virtuoel:Pehkui:3.8.2-1.20.1-forge")

//    implementation fg.deobf("flat.dir:alexscaves:2.0.2")
//    implementation fg.deobf("flat.dir:appleskin-forge-mc1.20.1:2.5.1")
//    implementation fg.deobf("flat.dir:baguettelib-1.20.1-Forge:1.1.6")
//    implementation fg.deobf("flat.dir:BiomesOPlenty-forge-1.20.1:19.0.0.96")
//    implementation fg.deobf("flat.dir:chunkloaders-1.2.9-forge:mc1.20.1")
//    implementation fg.deobf("flat.dir:citadel-2.6.3:1.20.1")
//    implementation fg.deobf("flat.dir:corpsecurioscompat-1.20.1-Forge:4.0.1")
//    implementation fg.deobf("flat.dir:corpse-forge-1.20.1:1.0.23")
//    implementation fg.deobf("flat.dir:curios-forge:5.14.1+1.20.1")
//    implementation fg.deobf("flat.dir:FarmersDelight-1.20.1:1.2.11a")
//    implementation fg.deobf("flat.dir:ferritecore:6.0.1:forge")
//    implementation fg.deobf("flat.dir:geckolib-forge-1.20.1:4.8.3")
//    implementation fg.deobf("flat.dir:GlitchCore-forge-1.20.1:0.0.1.1")
//    implementation fg.deobf("flat.dir:macabre-0.8.4-forge:1.20.1")
//    implementation fg.deobf("flat.dir:modernfix-forge:5.26.2+mc1.20.1")
//    implementation fg.deobf("flat.dir:MouseTweaks-forge-mc1.20.1:2.25.1")
//    implementation fg.deobf("flat.dir:packetfixer-3.3.2-1.18:1.20.4:merged")
//    implementation fg.deobf("flat.dir:RapidLeafDecay-1.20.1:2.0.2")
//    implementation fg.deobf("flat.dir:sophisticatedbackpacks-1.20.1:3.24.35.1675")
//    implementation fg.deobf("flat.dir:sophisticatedcore-1.20.1:1.3.26.1759")
//    implementation fg.deobf("flat.dir:sophisticatedstorage-1.20.1:1.4.41.1679")
//    implementation fg.deobf("flat.dir:supermartijn642configlib-1.1.8-forge:mc1.20")
//    implementation fg.deobf("flat.dir:supermartijn642corelib-1.1.21-forge:mc1.20.1")
//    implementation fg.deobf("flat.dir:TerraBlender-forge-1.20.1:3.0.1.10")
//    implementation fg.deobf("flat.dir:xaerominimap-forge-1.20.1:25.3.10")
//    implementation fg.deobf("flat.dir:xaeroworldmap-forge-1.20.1:1.40.11")
//    implementation fg.deobf("flat.dir:places-0.4.5-forge:1.20.1")
}

mixin {
    // MixinGradle Settings
    add sourceSets.main, 'mixins.otherverse.refmap.json'
    config 'mixins.otherverse.json'
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "otherverse",
                "Specification-Vendor"    : "shermansplanet",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "shermansplanet",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
// publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
